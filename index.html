<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Friction: 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- အပေါ်ပိုင်း Dashboard (အရင်းအမြစ်များနှင့် ငွေကြေး) -->
        <header id="dashboard">
            <div class="stat-box">💰 ရွှေ: <span id="gold">1000</span></div>
            <div class="stat-box">⚡ စွမ်းအင်: <span id="energy">500</span></div>
            <div class="stat-box">🛡️ စစ်အင်အား: <span id="military">50</span></div>
            <div class="stat-box">📅 ခုနှစ်: <span id="year">2026</span></div>
        </header>

        <!-- အလယ်ပိုင်း မြေပုံနှင့် နိုင်ငံများ -->
        <main id="map-section">
            <div id="map-wrapper">
                <!-- ဤနေရာတွင် world-map.jpg ဖိုင်ကို တိုက်ရိုက်ခေါ်ယူထားသည်[span_0](start_span)[span_0](end_span) -->
                <img src="world-map.jpg" alt="World Map" id="world-map">
                
                <!-- မြေပုံပေါ်ရှိ နိုင်ငံများကို နှိပ်ရန် နေရာသတ်မှတ်ချက် ခလုတ်များ -->
                <button class="country-marker" style="top: 40%; left: 20%;" onclick="selectCountry('USA')">USA</button>
                <button class="country-marker" style="top: 35%; left: 52%;" onclick="selectCountry('Europe')">Europe</button>
                <button class="country-marker" style="top: 45%; left: 75%;" onclick="selectCountry('Asia')">Asia</button>
            </div>
        </main>

        <!-- အောက်ပိုင်း ထိန်းချုပ်ရန် မီနူးနှင့် လုပ်ဆောင်ချက်များ -->
        <footer id="control-panel">
            <div id="country-info">
                <h3>ရွေးချယ်ထားသော နိုင်ငံ: <span id="selected-country">မရှိသေးပါ</span></h3>
            </div>
            <div class="action-buttons">
                <button onclick="buildEconomy()">စီးပွားရေးမြှင့်မည်</button>
                <button onclick="trainMilitary()">စစ်တပ်စုဖွဲ့မည်</button>
                <button onclick="doCyberAttack()">ဆိုက်ဘာတိုက်မည်</button>
                <button onclick="nextTurn()">အလှည့်ကျော်မည်</button>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
